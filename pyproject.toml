[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alo-rats-hardware"
version = "0.1.0"
description = "Robot-motion-only and processed-OCT interface for ALO-RATS"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.6",
  "numpy>=1.23",
  "PyYAML>=6.0",
  "scipy>=1.9",
]

[project.optional-dependencies]
robot = ["ur-rtde>=1.6"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "simulation"]
addopts = "-ra"
norecursedirs = [".git", "outputs"]
