[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alo-rats-hardware"
version = "0.1.0"
description = "UR5e, mounted-OCT, and Raspberry Pi PWM experiment interface for ALO-RATS"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.6",
  "line_profiler==5.0.2",
  "numpy>=1.23,<2",
  "opencv-python-headless==4.11.0.86",
  "PyYAML>=6.0",
  "scipy>=1.9,<1.14",
]

[project.optional-dependencies]
robot = ["ur-rtde>=1.6"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "simulation"]
addopts = "-ra"
norecursedirs = [".git", "outputs"]
